name: Docker CI Pipeline (Phase 32)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STEP 1: TEST GATE — Enforces "After tests pass" & "Do not deploy failed CI"
  # =========================================================================
  test-gate:
    name: Verify Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        run: |
          pytest tests/ -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend TypeScript Compilation
        working-directory: ./frontend
        run: npx tsc --noEmit

  # =========================================================================
  # STEP 2: DOCKER CI — Build, Tag with Commit SHA, and Push to AWS ECR
  # =========================================================================
  docker-build-push:
    name: Build & Tag Container Images
    needs: [test-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Derive Short Commit SHA
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Commit SHA Tag: ${SHORT_SHA}"

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional AWS Credentials & ECR Login when configured
      - name: Configure AWS Credentials
        id: aws-auth
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Log in to Amazon ECR
        id: login-ecr
        if: steps.aws-auth.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      # -------------------------------------------------------------
      # Build & Tag Backend Docker Image
      # Example tag: backend:a83f912
      # -------------------------------------------------------------
      - name: Build and Tag Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: ${{ steps.login-ecr.outcome == 'success' && github.event_name == 'push' }}
          tags: |
            homeverse-backend:${{ env.SHORT_SHA }}
            homeverse-backend:latest
            ${{ steps.login-ecr.outputs.registry != '' && format('{0}/homeverse-backend:{1}', steps.login-ecr.outputs.registry, env.SHORT_SHA) || '' }}
            ${{ steps.login-ecr.outputs.registry != '' && format('{0}/homeverse-backend:latest', steps.login-ecr.outputs.registry) || '' }}
          load: true

      # -------------------------------------------------------------
      # Build & Tag Frontend Docker Image
      # Example tag: frontend:a83f912
      # -------------------------------------------------------------
      - name: Build and Tag Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          push: ${{ steps.login-ecr.outcome == 'success' && github.event_name == 'push' }}
          tags: |
            homeverse-frontend:${{ env.SHORT_SHA }}
            homeverse-frontend:latest
            ${{ steps.login-ecr.outputs.registry != '' && format('{0}/homeverse-frontend:{1}', steps.login-ecr.outputs.registry, env.SHORT_SHA) || '' }}
            ${{ steps.login-ecr.outputs.registry != '' && format('{0}/homeverse-frontend:latest', steps.login-ecr.outputs.registry) || '' }}
          load: true

      # -------------------------------------------------------------
      # Security Scan on Built Docker Images (Phase 31 & 32 Compliance)
      # -------------------------------------------------------------
      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'homeverse-backend:${{ env.SHORT_SHA }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Summary of Container Images Built
        run: |
          echo "======================================================="
          echo "PHASE 32 DOCKER CI COMPLETE"
          echo "======================================================="
          echo "Backend Image:  homeverse-backend:${{ env.SHORT_SHA }}"
          echo "Frontend Image: homeverse-frontend:${{ env.SHORT_SHA }}"
          echo "Status: Container builds verified and tagged with commit SHA."
          echo "======================================================="
