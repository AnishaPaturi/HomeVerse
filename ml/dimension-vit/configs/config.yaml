model:
  backbone_type: "native_vit"  # "native_vit" or "hf_vit"
  hf_model_name: "google/vit-base-patch16-224"
  img_size: 224
  patch_size: 16
  in_channels: 3
  embed_dim: 192
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  room_embed_dim: 64
  head_hidden_dim: 256
  dropout: 0.1

dataset:
  data_dir: "ml/dimension-vit/dataset/data"
  train_split: 0.8
  val_split: 0.2
  seed: 42
  room_labels:
    - "Overall Building"
    - "Living Room"
    - "Master Bedroom"
    - "Bedroom"
    - "Kitchen"
    - "Dining Room"
    - "Bathroom"
    - "Balcony"

training:
  batch_size: 8
  num_epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.01
  loss_type: "smooth_l1"  # "smooth_l1" or "mse"
  checkpoint_dir: "ml/dimension-vit/checkpoints"
  best_model_name: "vit_dimension_best.pth"
  save_every: 5

validation:
  area_tolerance_ratio: 0.20  # 20% tolerance on width * height vs area
  min_dimension_m: 1.0
  max_dimension_m: 25.0
